<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>ARITMA – Belajar Barisan & Deret Aritmetika</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <button id="btnBack" class="icon-btn hidden" aria-label="Kembali">←</button>
    <h1 id="judul">ARITMA</h1>
    <span id="userBadge" class="badge hidden"></span>
  </header>

  <main id="app">
    <!-- ================= HALAMAN AWAL / LOGIN ================= -->
    <section id="v-login" class="view">
      <div class="hero">
        <div id="hero3d" class="hero3d"></div>
        <h2>Belajar Barisan &amp; Deret Aritmetika</h2>
        <p>Singkat, bertahap, dan dekat dengan kehidupan sehari-hari.</p>
      </div>
      <form id="formLogin" class="card">
        <label>Kode siswa <input id="inKode" placeholder="contoh: S01" required maxlength="20" autocomplete="off"></label>
        <label>Nama panggilan (opsional) <input id="inNama" maxlength="60"></label>
        <label>Kelas (opsional) <input id="inKelas" placeholder="VIII" maxlength="10"></label>
        <button class="btn primary" type="submit">Masuk</button>
        <p id="loginErr" class="err"></p>
      </form>
    </section>

    <!-- ================= BERANDA ================= -->
    <section id="v-home" class="view hidden">
      <p class="hello" id="hello"></p>
      <div class="menu">
        <button class="menu-item" data-go="materi"><span>📘</span>Materi<small>5 kartu singkat</small></button>
        <button class="menu-item" data-go="lab"><span>🧊</span>Lab 3D<small>Lihat pola bergerak</small></button>
        <button class="menu-item" data-go="kalkulator"><span>🧮</span>Kalkulator<small>Hitung + langkah</small></button>
        <button class="menu-item" data-go="latihan"><span>✏️</span>Latihan<small>Mudah → sulit</small></button>
        <button class="menu-item wide" data-go="literasi"><span>🏆</span>Tes Literasi Matematika<small>4 soal cerita · skor per tahap</small></button>
        <button class="menu-item" data-go="progres"><span>📈</span>Progres<small>Riwayat skor</small></button>
        <button class="menu-item" id="btnLogout"><span>🚪</span>Keluar<small>Ganti kode</small></button>
      </div>
      <div class="legend card">
        <b>Kode warna:</b>
        <span class="c-text">hitam = penjelasan</span> ·
        <span class="c-rumus">merah = rumus</span> ·
        <span class="c-kerja">biru = pengerjaan</span>
      </div>
    </section>

    <!-- ================= MATERI ================= -->
    <section id="v-materi" class="view hidden">
      <div class="progress-dots" id="materiDots"></div>
      <article id="materiCard" class="card materi"></article>
      <div class="row">
        <button class="btn" id="mPrev">‹ Sebelumnya</button>
        <button class="btn primary" id="mNext">Berikutnya ›</button>
      </div>
    </section>

    <!-- ================= LAB 3D ================= -->
    <section id="v-lab" class="view hidden">
      <div id="lab3d" class="canvas3d"></div>
      <div class="card">
        <div class="sliders">
          <label>a (suku pertama): <b id="vA">2</b><input type="range" id="sA" min="1" max="10" value="2"></label>
          <label>b (beda): <b id="vB">2</b><input type="range" id="sB" min="-2" max="5" value="2"></label>
          <label>n (banyak suku): <b id="vN">6</b><input type="range" id="sN" min="1" max="12" value="6"></label>
        </div>
        <div class="row">
          <button class="btn" id="modeUn">Tampilkan Uₙ</button>
          <button class="btn" id="modeSn">Tampilkan Sₙ</button>
        </div>
        <p id="labInfo" class="info"></p>
      </div>
    </section>

    <!-- ================= KALKULATOR ================= -->
    <section id="v-kalkulator" class="view hidden">
      <form id="formHitung" class="card">
        <div class="grid3">
          <label>a <input id="kA" inputmode="decimal" value="5"></label>
          <label>b <input id="kB" inputmode="decimal" value="3"></label>
          <label>n <input id="kN" inputmode="numeric" value="10"></label>
        </div>
        <button class="btn primary" type="submit">Hitung</button>
      </form>
      <div id="hasilHitung"></div>
    </section>

    <!-- ================= LATIHAN ================= -->
    <section id="v-latihan" class="view hidden">
      <div class="progress-dots" id="latDots"></div>
      <article id="latCard" class="card"></article>
    </section>

    <!-- ================= TES LITERASI ================= -->
    <section id="v-literasi" class="view hidden">
      <div class="progress-dots" id="litDots"></div>
      <article id="litCard" class="card"></article>
    </section>

    <!-- ================= PROGRES ================= -->
    <section id="v-progres" class="view hidden">
      <div id="progresList"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
